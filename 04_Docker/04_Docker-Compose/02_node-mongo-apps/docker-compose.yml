services:

  # 🍃 MongoDB
  mongo:
    image: mongo
    container_name: mongo-container

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - mongo-network


  # 🟢 Node.js Application
  node-app:
    build: .
    container_name: node-container

    ports:
      - "5050:5050"

    depends_on:
      - mongo

    networks:
      - mongo-network


  # 🖥️ Mongo Express
  mongo-express:
    image: mongo-express
    container_name: mongo-express

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_SERVER: mongo

    depends_on:
      - mongo

    networks:
      - mongo-network


# 💾 MongoDB persistent storage
volumes:
  mongo-data:


# 🌐 Common network
networks:
  mongo-network:
