services:

  #---- MongoDB ----#
  mongo:
    image: mongo:8.2
    container_name: mongo-container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-database:/data/db
    networks:
      - mongo-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet -u admin -p qwerty --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1" ] 
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  #---- Node.js App -----#
  node-app:
    image: ankittripathidocker/node-app:latest
    container_name: node-container
    ports:
      - "5050:5050"
    depends_on:
      - mongo
    networks:
      - mongo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/getUsers || exit 1"] 
      interval: 10s
      timeout: 5s 
      retries: 5 
      start_period: 30s


  #--- Mongo Express ----#
  mongo-express:
    image: mongo-express
    container_name: mongo-express-container
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_ENABLED: true 
      ME_CONFIG_BASICAUTH_USERNAME: admin 
      ME_CONFIG_BASICAUTH_PASSWORD: qwerty
    depends_on:
      - mongo
    networks:
      - mongo-network
    restart: unless-stopped


# 🌐 Common network
networks:
  mongo-network:
