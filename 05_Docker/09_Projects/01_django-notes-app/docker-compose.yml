services:

  # ============================================================
  # MYSQL DATABASE
  # ============================================================
  mysql_db:
    image: mysql
    container_name: mysql-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      # MySQL data stored in project folder
      - ./data/mysql/db:/var/lib/mysql
    networks:
      - notes-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  # ============================================================
  # DJANGO BACKEND
  # ============================================================
  django_app:
    build:
      context: .
    image: django_app
    container_name: django-container
    # Run migrations and start Django
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn notesapp.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - notes-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ============================================================
  # NGINX REVERSE PROXY
  # ============================================================
  nginx:
    build:
      context: ./nginx
    image: django-notes-nginx
    container_name: nginx-container
    ports:
      - "80:80"
    depends_on:
      django_app:
        condition: service_healthy
    networks:
      - notes-app
    restart: unless-stopped


# ============================================================
# NETWORK
# ============================================================
networks:
  notes-app:
